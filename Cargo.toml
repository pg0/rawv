[package]
name = "rawv"
version = "0.1.1"
edition = "2024"
default-run = "rawv"

[dependencies]
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
drag = "2.1.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
fast_image_resize = "6.2.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
parking_lot = "0.13.0"
rawler = "0.8.0"
redb = "5.0.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.4.0"
winreg = "0.56.0"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"

[build-dependencies]
winresource = "0.1.34"
